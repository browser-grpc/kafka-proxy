[package]
name = "kafka-proxy"
version = "0.48.2"
edition = "2021"
description = "kafka-proxy executable: gateway exposing Apache Kafka/Redpanda to kafka-grpc clients (generated grpcdc.kafka.v1 service over stdio/TCP/WebRTC DataChannel)"
license = "Apache-2.0"

[[bin]]
name = "kafka_proxy"
path = "src/main.rs"

[features]
default = []
# Run over the reimplemented WebRTC stack (via grpc-dc).
webrtc = ["grpc-dc/webrtc"]
# TLS to the broker (mirrors the grpc-dc kafka-tls feature).
kafka-tls = ["grpc-dc/kafka-tls"]

[dependencies]
grpc-dc = { version = "0.48.2" }
kafka-native = { version = "0.48.2" }
kafka-service = { version = "0.48.2" }
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
